<section class="hero-section">

  <!-- Background photo blurred -->
  <div class="hero-bg-photo"></div>

  <!-- Deep overlay gradient -->
  <div class="hero-overlay"></div>

  <!-- Ambient color glows -->
  <div class="glow glow-left"></div>
  <div class="glow glow-right"></div>

  <!-- Particle canvas -->
  <canvas #particleCanvas></canvas>

  <!-- Main layout -->
  <div class="hero-layout">

    <!-- Left: Text content -->
    <div class="hero-content">
      <p class="eyebrow">Sarah,</p>
      <h1 class="main-title">Pardonne<br><span class="title-accent">‑moi</span></h1>
      <p class="subtitle">J'ai trahi ta confiance.<br>Ces mots sont ma façon de me mettre à genoux.</p>

      <div class="date-badge">
        <span class="dot"></span>
        Une lettre écrite avec honte et amour
        <span class="dot"></span>
      </div>

      <div class="hero-cta" (click)="scrollToNext()" style="cursor:pointer;">
        <span>Lire ce que j'ai à te dire</span>
        <div class="cta-arrow">↓</div>
      </div>
    </div>

    <!-- Right: Portrait frame with video -->
    <div class="portrait-wrap">
      <div class="portrait-frame" (click)="toggleSound()" style="cursor:pointer;">
        <video
          #portraitVideo
          src="assets/media/portrait-video.mp4"
          autoplay
          loop
          playsinline
          muted
          aria-label="Vidéo de Sarah"
        ></video>
        <div class="sound-btn" [class.unmuted]="!isMuted">
          <span>{{ isMuted ? '🔇' : '🔊' }}</span>
        </div>
      </div>
      <div class="portrait-label">
        <span class="font-script">Ma Sarah</span>
      </div>
    </div>

  </div>

  <!-- Scroll hint bottom -->
  <div class="scroll-hint">
    <div class="scroll-arrow"></div>
  </div>

</section>
